[project]
name = "yavin"
version = "2025.0"
description = "Personal web tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "bibliocommons>=2026.0",
    "biblionix>=2026.0",
    "certifi>=2026.10.23",
    "cssselect>=1.6.0",
    "flask>=3.1.3",
    "fort>=2026.0",
    "htpy>=26.5.1",
    "httpx2>=2.16.0",
    "lxml>=6.1.3",
    "markupsafe>=3.0.4",
    "notch>=2026.0",
    "psycopg2-binary>=2.9.13",
    "pygal>=3.1.3",
    "pyjwt>=2.15.1",
    "tello-usage>=2026.2",
    "waitress>=3.0.2",
    "werkzeug>=3.1.9",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
yavin = "yavin:main"
playlist = "yavin.playlist:main"

[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.13.5,<0.14.0"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "uv-build>=0.13.5",
]

[tool.ruff.lint]
extend-select = ["ANN", "DTZ", "E", "F", "FURB", "I", "ICN", "PERF", "Q", "RSE", "RUF", "S", "UP"]
